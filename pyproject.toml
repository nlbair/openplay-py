[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openplay"
version = "0.1.0"
description = "Open men's soccer event data (every pass, shot and tackle with coordinates) with xG on every shot"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Noah Bair", email = "noahlbair@gmail.com"}]
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "pyarrow>=10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/nlbair/openplay-py"
Data = "https://github.com/nlbair/openplay"

[tool.setuptools.packages.find]
where = ["src"]
